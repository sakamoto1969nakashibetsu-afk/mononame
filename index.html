<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff8ef">
<title>ものの なまえを よもう</title>
<style>
:root{--bg:#fff8ef;--ink:#293550;--muted:#667087;--card:#fff;--line:#f0d9c8;--accent:#db7047;--purple:#67499c;--pale:#fff0e3}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:linear-gradient(145deg,#fff4e7,#f5f0ff 70%,#eff9f5);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;display:flex;justify-content:center}
.app{width:min(900px,100%);padding:clamp(10px,2vw,20px)}h1{font-size:clamp(22px,4vw,32px);margin:2px 0 12px;color:#62457c}.card{background:var(--card);border:2px solid #eadcf2;border-radius:24px;padding:clamp(13px,2.6vw,24px);box-shadow:0 8px 28px #49347b14}
.lead{font-weight:700;font-size:18px}.small{font-size:14px;line-height:1.5;color:var(--muted)}.choices{display:flex;gap:9px;margin:10px 0 14px;flex-wrap:wrap}.choices button{flex:1;min-width:90px}
button{font:inherit;font-size:17px;padding:11px 14px;border:2px solid #ded3e9;border-radius:14px;background:white;color:#533b79;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:3px solid #f5b94c;outline-offset:2px}button:disabled{opacity:.45;cursor:not-allowed}.len.selected{background:var(--purple);border-color:var(--purple);color:white}.word{height:clamp(210px,34vh,350px);min-height:190px;display:grid;place-items:center;background:var(--pale);border:3px solid #f5d4bd;border-radius:22px;color:#56366a;font-size:clamp(76px,18vw,156px);font-weight:500;letter-spacing:.08em;line-height:1;user-select:none}.counter{text-align:center;font-size:15px;color:var(--muted);margin:10px 0 4px;min-height:22px}.status{text-align:center;min-height:24px;margin:0 0 10px;color:#4f596f}.actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.actions button{min-height:52px}.primary{background:var(--accent);border-color:var(--accent);color:white;font-weight:700}.secondary{background:#ecf5ff;border-color:#d1e4f6;color:#31567c}.read{background:#e9f6ed;border-color:#cee8d3;color:#2d6845}.result{font-weight:700;color:#67499c;text-align:center;min-height:25px;margin:10px 0}.settings{border-top:1px solid #eee7f1;margin-top:16px;padding-top:12px}.note{background:#f7f3fa;border-radius:14px;padding:12px;margin-top:14px}.cover{margin-top:10px}.hidden{display:none!important}
@media(max-width:560px){.choices{gap:7px}.choices button{min-width:0;padding:10px}.actions{grid-template-columns:1fr 1fr}.actions #next{grid-column:1/-1;grid-row:1}.word{height:clamp(180px,32vh,260px)}button{font-size:16px}}
@media(orientation:landscape) and (max-height:550px){.app{padding:6px 14px}h1{font-size:20px;margin-bottom:6px}.card{padding:10px 14px}.word{height:32vh;min-height:115px;font-size:clamp(70px,18vh,125px)}.choices{margin:5px 0 8px}.settings,.note{margin-top:8px;padding-top:8px}.actions button{min-height:40px;padding:7px}}
</style>
</head>
<body>
<main class="app">
<h1>🧺 ものの なまえを よもう</h1>
<section class="card">
  <div class="lead">なんもじの なまえを よむ？</div>
  <div class="choices" role="group" aria-label="出題する文字数">
    <button class="len selected" type="button" data-n="2" aria-pressed="true">2もじ</button>
    <button class="len selected" type="button" data-n="3" aria-pressed="true">3もじ</button>
    <button class="len selected" type="button" data-n="4" aria-pressed="true">4もじ</button>
  </div>
  <div class="word" id="word" aria-live="polite">スタート</div>
  <div class="counter" id="counter">文字数を選んで「スタート」を押してね</div>
  <p class="status" id="status">ひらがなを見て、声に出して読んでみよう。</p>
  <div class="actions">
    <button class="primary" id="start" type="button">スタート</button>
    <button class="secondary" id="next" type="button" disabled>つぎの もんだい</button>
    <button class="read" id="model" type="button" disabled>お手本を聞く</button>
  </div>
  <div class="result" id="result" aria-live="polite"></div>
  <div class="settings">
    <label><input id="auto" type="checkbox"> お手本を聞いたあと、自動で次へ</label>
    <p class="small">「よめた！」を押すと次の問題に進みます。ランダム出題で、選んだ文字数の言葉を一通り出してから次の巡に進みます。</p>
  </div>
  <div class="note small">出題するのは、実際にある物・食べ物・生き物などの名前です。<br>「を」は文の中で使う助詞で、物の名前には通常使われません。そのため、物の名前だけでは「を」を含めて網羅できません。</div>
  <div class="cover small" id="coverage"></div>
</section>
</main>
<script>
// 表記はすべてひらがな。小さい文字も1文字として数えます。
const words={
2:["あめ","いす","うし","えび","おび","かさ","きく","くし","けん","こま","さじ","しお","すず","せき","そり","たこ","ちず","つえ","てら","とら","なべ","にく","ぬの","ねこ","のり","はこ","ひも","ふで","へび","ほね","まめ","みそ","むし","めし","もち","ゆか","りす","るり","わた","わに"],
3:["あひる","いちご","うさぎ","えのぐ","おさら","かばん","きつね","くるま","けむり","こけし","さかな","しずく","すいか","せんす","たわし","ちくわ","つみき","てがみ","とかげ","なすび","ぬりえ","ねずみ","はさみ","へちま","ほうき","まくら","みかん","めがね","もなか","やかん","ゆびわ","よろい","らっぱ","りぼん","れんが","らんぷ","わかめ","たんす","はんこ","ふくろ","こいぬ","こねこ"],
4:["えんぴつ","おりがみ","くつした","けしごむ","こうもり","しんぶん","てぶくろ","ほうせき","おまもり","やきもの","ふくろう","あさがお","おんがく","ふうせん","ろうそく","かんづめ","けんだま","みずうみ","おもちゃ","なわとび","ふでばこ","くわがた","せっけん","かみなり","きんぎょ"]
};
const allKana=[..."あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん"];
const selected=new Set([2,3,4]);let deck=[],current="",shown=0,total=0,cycle=0,readCount=0,started=false;
const $=id=>document.getElementById(id);
function shuffle(a){for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function draw(){const options=[...selected].flatMap(n=>words[n]);deck=shuffle(options);total=deck.length;shown=0;cycle++;$('result').textContent=`${cycle}しゅうめ`;started=true;nextWord()}
function nextWord(){if(!started){draw();return}if(!deck.length){deck=shuffle([...selected].flatMap(n=>words[n]));cycle++;$('result').textContent=`${cycle}しゅうめ`; $('status').textContent="一通りできました！もう一巡します。"}else{$('status').textContent="ひらがなを見て、声に出して読んでみよう。"}current=deck.shift();shown++;$('word').textContent=current;$('counter').textContent=`${shown} / ${total}もん　（${[...current].length}もじ）`; $('next').disabled=false;$('model').disabled=false;$('next').textContent="よめた！ つぎへ"}
function updateCoverage(){const chars=new Set([...new Set([...selected].flatMap(n=>words[n]))].join(""));const covered=allKana.filter(k=>chars.has(k));$('coverage').textContent=`この出題セットに出てくるひらがな：${covered.join("　")}　（${covered.length} / 46文字）`}
function speak(){if(!current||!("speechSynthesis" in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(current);u.lang="ja-JP";u.rate=.78;speechSynthesis.speak(u);if($('auto').checked)u.onend=()=>setTimeout(nextWord,500)}
document.querySelectorAll(".len").forEach(b=>b.addEventListener("click",()=>{const n=Number(b.dataset.n);if(selected.has(n))selected.delete(n);else selected.add(n);b.classList.toggle("selected",selected.has(n));b.setAttribute("aria-pressed",String(selected.has(n)));started=false;deck=[];current="";$('word').textContent="スタート";$('counter').textContent="文字数を選んで「スタート」を押してね";$('next').disabled=true;$('model').disabled=true;$('start').disabled=!selected.size;updateCoverage()}));
$('start').addEventListener("click",draw);$('next').addEventListener("click",nextWord);$('model').addEventListener("click",speak);$('start').disabled=false;updateCoverage();
</script>
</body>
</html>
